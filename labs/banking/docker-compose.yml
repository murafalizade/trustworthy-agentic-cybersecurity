networks:
  dmz:
    driver: bridge
    ipam:
      config: [{ subnet: 10.10.1.0/24 }]
  app-tier:
    driver: bridge
    ipam:
      config: [{ subnet: 10.10.2.0/24 }]
  data-tier:
    driver: bridge
    ipam:
      config: [{ subnet: 10.10.3.0/24 }]
  mgmt:
    driver: bridge
    ipam:
      config: [{ subnet: 10.10.4.0/24 }]

volumes:
  pg_data:
  grafana_data:

services:
  # --- Edge router/firewall: the only container with a leg in every
  # segment. FRR gives it a routing-protocol fingerprint (OSPF, vty);
  # iptables FORWARD is the piece that actually matters -- it is wide
  # open by default, so a foothold in dmz can reach data-tier directly.
  router:
    build: ./router
    container_name: bank-router
    hostname: bank-router
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      dmz: { ipv4_address: 10.10.1.250 }
      app-tier: { ipv4_address: 10.10.2.250 }
      data-tier: { ipv4_address: 10.10.3.250 }
      mgmt: { ipv4_address: 10.10.4.250 }

  # --- Network IDS sensor, sharing the router's netns so it sees every
  # inter-segment hop the router's wide-open FORWARD policy allows.
  router-suricata:
    build: ./router-suricata
    container_name: bank-router-suricata
    network_mode: "service:router"
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [router]
    volumes:
      - ./logs/router:/var/log/suricata

  # --- Public-facing online banking portal (DMZ)
  customer-portal:
    build: ./services/customer-portal
    container_name: bank-customer-portal
    hostname: customer-portal
    networks:
      dmz: { ipv4_address: 10.10.1.10 }
    depends_on: [router]
    ports:
      - "8081:80"
    volumes:
      - ./logs/customer-portal:/var/log/nginx

  customer-portal-route:
    image: alpine:3.19
    network_mode: "service:customer-portal"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null 2>&1 && ip route replace 10.10.0.0/16 via 10.10.1.250"]
    depends_on: [customer-portal, router]
    restart: "no"

  # --- Core banking API gateway (app tier)
  core-banking:
    build: ./services/core-banking
    container_name: bank-core-banking
    hostname: core-banking
    networks:
      app-tier: { ipv4_address: 10.10.2.10 }
    depends_on: [router]
    volumes:
      - ./logs/core-banking:/var/log/nginx

  core-banking-route:
    image: alpine:3.19
    network_mode: "service:core-banking"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null 2>&1 && ip route replace 10.10.0.0/16 via 10.10.2.250"]
    depends_on: [core-banking, router]
    restart: "no"

  # --- Transactions/ledger service (app tier)
  transactions:
    build: ./services/transactions
    container_name: bank-transactions
    hostname: transactions
    networks:
      app-tier: { ipv4_address: 10.10.2.11 }
    depends_on: [router]
    volumes:
      - ./logs/transactions:/var/log/nginx

  transactions-route:
    image: alpine:3.19
    network_mode: "service:transactions"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null 2>&1 && ip route replace 10.10.0.0/16 via 10.10.2.250"]
    depends_on: [transactions, router]
    restart: "no"

  # --- Third-party vendor/supply-chain portal (app tier)
  supply-chain:
    build: ./services/supply-chain
    container_name: bank-supply-chain
    hostname: supply-chain
    networks:
      app-tier: { ipv4_address: 10.10.2.12 }
    depends_on: [router]
    volumes:
      - ./logs/supply-chain:/var/log/nginx

  supply-chain-route:
    image: alpine:3.19
    network_mode: "service:supply-chain"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null 2>&1 && ip route replace 10.10.0.0/16 via 10.10.2.250"]
    depends_on: [supply-chain, router]
    restart: "no"

  # --- Shared Postgres cluster (data tier). Trust auth = no password
  # required on the wire once you can reach port 5432, on top of the
  # weak per-database creds seeded in init.sql.
  postgres:
    image: postgres:16
    container_name: bank-postgres
    hostname: postgres
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      data-tier: { ipv4_address: 10.10.3.10 }
    depends_on: [router]

  postgres-route:
    image: alpine:3.19
    network_mode: "service:postgres"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null 2>&1 && ip route replace 10.10.0.0/16 via 10.10.3.250"]
    depends_on: [postgres, router]
    restart: "no"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: bank-node-exporter
    hostname: node-exporter
    networks:
      mgmt: { ipv4_address: 10.10.4.12 }
    depends_on: [router]

  node-exporter-route:
    image: alpine:3.19
    network_mode: "service:node-exporter"
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "apk add --no-cache iproute2 >/dev/null 2>&1 && ip route replace 10.10.0.0/16 via 10.10.4.250"]
    depends_on: [node-exporter, router]
    restart: "no"
