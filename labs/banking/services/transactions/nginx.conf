server {
    listen 80 default_server;
    server_name _;
    add_header X-Powered-By "txn-service/1.9.0";

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Full internal endpoint map exposed without auth -- prime recon
    # target once an attacker reaches the app tier.
    location /swagger.json {
        default_type application/json;
        alias /usr/share/nginx/html/swagger.json;
    }

    location /nginx_status {
        stub_status;
    }
}
