{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Support Tickets</h2>
  <table>
    <tr><th>Date</th><th>User</th><th>Subject</th><th>Message</th><th>Status</th><th></th></tr>
    {% for c in complaints %}
    <tr>
      <td>{{ c.created_at.strftime('%Y-%m-%d') }}</td>
      <td>{{ c.username }}</td>
      <td>{{ c.subject }}</td>
      <td>{{ c.message }}</td>
      <td><span class="badge {{ c.status }}">{{ c.status }}</span></td>
      <td>
        {% if c.status == 'open' %}
        <form class="inline-form" method="post" action="{{ url_for('admin_resolve_complaint', complaint_id=c.complaint_id) }}">
          <button type="submit">Resolve</button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
