log_format json_analytics escape=json
  '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status": "$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for"'
  '}';

server {
    listen 80 default_server;
    server_name _;
    add_header X-Powered-By "OnlineBanking-Portal/3.2.1";

    # Overrides the image default of symlinking to stdout -- these are
    # bind-mounted to the host so the ID agent can tail real defender-side
    # evidence instead of the attacker's own campaign log.
    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    location /api/health {
        default_type application/json;
        return 200 '{"service":"customer-portal","version":"3.2.1","build":"2023-08-14"}';
    }

    # Accidentally-published repo metadata -- a common real-world recon
    # finding (deploy pipeline copied .git/ into the webroot by mistake).
    location /.git/config {
        default_type text/plain;
        alias /usr/share/nginx/html/leaked-git-config.txt;
    }

    location /nginx_status {
        stub_status;
    }
}
