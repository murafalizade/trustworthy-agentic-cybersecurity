server {
    listen 80 default_server;
    server_name _;
    add_header X-Powered-By "VendorPortal/0.9.2-beta";

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    location /nginx_status {
        stub_status;
    }
}
