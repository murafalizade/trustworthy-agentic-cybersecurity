log_format json_analytics escape=json
  '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status": "$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for"'
  '}';

server {
    listen 80 default_server;
    server_name _;
    add_header X-Powered-By "Spring Boot/2.3.1.RELEASE";

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Unauthenticated Spring Boot Actuator-style env dump -- one of the
    # most common real-world fintech findings (CVE-class info disclosure,
    # not a specific CVE here, just the pattern).
    location /actuator/env {
        default_type application/json;
        alias /usr/share/nginx/html/actuator-env.json;
    }

    location /nginx_status {
        stub_status;
    }
}
