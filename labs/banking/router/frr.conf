frr version 8.4
frr defaults traditional
hostname bank-edge-router
log syslog informational
!
interface eth0
 description DMZ-SEGMENT
!
interface eth1
 description APP-TIER-SEGMENT
!
interface eth2
 description DATA-TIER-SEGMENT
!
interface eth3
 description MGMT-SEGMENT
!
router ospf
 ospf router-id 10.10.1.250
 network 10.10.0.0/16 area 0
!
line vty
!
