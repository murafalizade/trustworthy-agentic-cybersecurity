services:
  # Target is now labs/banking (see ../banking/docker-compose.yml) — run
  # `docker compose up -d` there first so the `banking_dmz` network this
  # project attaches to below already exists.
  attacker:
    build: ./attacker
    container_name: lab-attacker
    hostname: lab-attacker
    # NET_ADMIN lets the attacker add a static route to 10.10.0.0/16 via
    # bank-router once it has a dmz foothold, the same way each banking
    # service's own `*-route` sidecar does — this is what turns "scan the
    # portal" into real lateral movement against app-tier/data-tier,
    # exercising the router's wide-open FORWARD policy the lab documents.
    cap_add: [NET_ADMIN]
    networks:
      - banking_dmz
    volumes:
      - ./banking/logs/attacker:/var/log/lab
    environment:
      - TARGET_HOST=customer-portal
      - TARGET_SSH_PORT=22

  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lab-agent
    networks:
      - banking_dmz
    volumes:
      # Independent defender-side evidence: each service's own nginx
      # access/error log, bind-mounted read-only from banking's own
      # docker-compose.yml (see labs/banking/docker-compose.yml and each
      # service's nginx.conf). The attacker's own campaign log is
      # deliberately NOT mounted here — it's attacker ground truth for
      # grading, never agent input (see agents/id_agent/main.py).
      - ./banking/logs/customer-portal:/var/log/lab/customer-portal:ro
      - ./banking/logs/core-banking:/var/log/lab/core-banking:ro
      - ./banking/logs/transactions:/var/log/lab/transactions:ro
      - ./banking/logs/supply-chain:/var/log/lab/supply-chain:ro
    env_file:
      - ../.env
    command: ["uv", "run", "python", "-u", "-m", "cybersecurity_agent.agents.id_agent.main"]

  # --- Defender-side log pipeline: ships each banking service's own
  # access/error logs into Elasticsearch so the AI can query structured,
  # typed log data instead of (or alongside) the id_agent's raw file tail
  # above. Deliberately on its own default network, not banking_dmz — it
  # has no reason to be reachable from the lab's attack surface.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: lab-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - lab_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: lab-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat-setup:
    image: curlimages/curl:8.9.1
    container_name: lab-filebeat-setup
    volumes:
      - ../filebeat:/filebeat:ro
    entrypoint: ["sh", "/filebeat/setup.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: lab-filebeat
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ../filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./banking/logs/customer-portal:/var/log/banking/customer-portal:ro
      - ./banking/logs/core-banking:/var/log/banking/core-banking:ro
      - ./banking/logs/transactions:/var/log/banking/transactions:ro
      - ./banking/logs/supply-chain:/var/log/banking/supply-chain:ro
    depends_on:
      filebeat-setup:
        condition: service_completed_successfully

volumes:
  lab_es_data:

networks:
  banking_dmz:
    external: true
    name: banking_dmz
